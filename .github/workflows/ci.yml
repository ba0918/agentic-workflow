name: CI

# push is limited to main so a branch with an open PR runs once (via
# pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow, so a release runs exactly the checks every
  # push and pull request runs. Called rather than restated there: two copies of
  # the check list could drift, and the release would then tag a tree the other
  # copy would have failed.
  workflow_call:

# Nothing in this workflow writes to the repository, so the token is held to
# read access instead of the repository default.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running check.
# In a run called by the release workflow, github.workflow is the caller's
# name ("Release"), so this group never equals the release's own "release"
# group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash runs with -eo pipefail; the implicit default shell omits pipefail.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify documents, skills and version declarations
    # The tracking label is acceptable: Bun and the validators are pinned here
    # and in bun.lock, and the image's only tool used below is jq, for plain
    # field reads.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Nothing in this job pushes, so the token is not left behind for the
      # third-party code the later steps run.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          # Minor-series pin, the same shape the sister repositories use, so a
          # runtime major update cannot change CI behavior on its own. The
          # series has to be the one that wrote bun.lock: its lockfile format
          # (lockfileVersion 2) is unknown to the 1.3 series, which then
          # refuses the frozen install.
          bun-version: "1.4.x"

      # --frozen-lockfile refuses to rewrite the lockfile, so the textlint and
      # skills-ref versions checked here are the recorded ones, verified against
      # the lockfile's integrity hashes, rather than whatever a fresh resolution
      # would produce.
      - name: Install the pinned toolchain
        run: bun install --frozen-lockfile

      # The same command PROJECT.md documents for local runs, so CI and the
      # documentation cannot drift apart.
      - name: Lint the approved documents
        run: bun run lint:docs

      # The reference validator checks the published Agent Skills
      # specification. It is a dev dependency pinned in bun.lock, so a release
      # of the validator cannot change what a green build means; bump it
      # deliberately.
      - name: Validate the skills against the Agent Skills reference validator
        run: |
          set -euo pipefail
          for skill in skills/*/; do
            echo "== $skill"
            bunx skills-ref validate "$skill"
          done

      # plugin.json declares the version; marketplace.json and package.json
      # repeat it for the routes that read them, so both can only ever follow.
      # A disagreement is otherwise invisible until a consumer installs by
      # whichever route holds the stale copy.
      - name: Check the plugin version declarations agree
        run: |
          set -euo pipefail
          canonical=$(jq -r .version .claude-plugin/plugin.json)
          for follower in \
            "marketplace.json:$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" \
            "package.json:$(jq -r .version package.json)"; do
            test "$canonical" = "${follower#*:}" || {
              echo "plugin.json declares $canonical, ${follower%%:*} declares ${follower#*:}"
              exit 1
            }
          done
