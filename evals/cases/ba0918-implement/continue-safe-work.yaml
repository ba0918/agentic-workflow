skill: ba0918-implement
id: continue-safe-work
title: 通常の漏れと意味を変えない文書改訂を自走する
source: docs/spec/implement.md
executor_tier: standard
isolation: worktree
files:
  - from: safe-autonomy.md
    to: situation.md
prompt: |
  situation.mdの状態から承認済みplanの実装を続けてください。
expected_output: |
  テストfileの理由と文書の意味判定を証拠へ記録し、artifactの途中承認を求めず実装を続ける。
expectations:
  - text: plan working bytesを最後にplanを変更したapproval commitのbytesと完全一致させ、承認版をparseする
    critical: true
  - text: Verification coverageとStep見出しからruntimeが完全なstep contractを導出し、bindやreboundでcaller指定のcompletionを受け取らない
    critical: true
  - text: spec driftは承認版・現在版・Git diffを読んで意味判定し、文言だけなら拒否せず続ける
    critical: true
  - text: Scope外の安全なtests/validator_test.pyを理由付きで補完する
    critical: true
  - text: 文書のGit差分を観測し、重要な判断が動いていない意味判定を記録して現在版へ追従する
    critical: true
  - text: artifactの人承認を途中で求めず、独立review可能な証拠を残す
    critical: true
  - text: 全commitへ秘密・危険path・一時file・log・生成物の検査を行う
    critical: true
  - text: safetyの自己申告を使わず実staged diffとcommit objectの全pathからruntimeが判定する
    critical: true
  - text: 変更のないcheckまたはexternalはcommitを要求せず、testとartifactはcommitを要求する
    critical: true
  - text: checkは成功commandを1件以上要求し、artifactはformat checkerが無い場合の空checksを許してもpath・commit・独立review可能性を維持する
    critical: true
  - text: testはRED・GREEN・REFACTOR、checkはplan宣言順の全command、externalは限定要約と条件判定をcompletion evidenceにする
    critical: true
  - text: 全step evidence・commit・安全検査・clean worktreeが揃ったときだけimplementation_greenをruntimeに導出させる
    critical: true
