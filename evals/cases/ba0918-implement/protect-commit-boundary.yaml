skill: ba0918-implement
id: protect-commit-boundary
title: commit境界をGitのpath・履歴・理由へ束縛する
source: docs/spec/implement.md
executor_tier: standard
isolation: worktree
files:
  - from: commit-boundary.md
    to: situation.md
prompt: |
  situation.mdの候補を検査し、安全に記録できる実装証拠だけを残してください。
expected_output: |
  危険なpathとside-branch commitと不正な理由集合を拒否し、正当なGit証拠だけを記録する。
expectations:
  - text: staged diffとcommit objectの変更pathをruntime自身がGitから導き、危険なpath・一時file・log・生成物を予定範囲の内外によらず拒否する
    critical: true
  - text: 変更内容の文字列は検査せず、拒否したpathとその分類だけを返して生のcommand出力をeventへ残さない
    critical: true
  - text: approval commitより後かつbound branch上のcommitだけを一つのstepへ一度だけ記録する
    critical: true
  - text: completion時にbranch履歴commit集合とrecorded commit集合を双方向照合する
    critical: true
  - text: unplanned reasonは実Git pathとの差について不足・余分・重複をすべて拒否する
    critical: true
