skill: ba0918-implement
id: protect-commit-boundary
title: commit境界をGit内容・履歴・理由へ束縛する
source: docs/spec/implement.md
executor_tier: standard
isolation: worktree
files:
  - from: commit-boundary.md
    to: situation.md
prompt: |
  situation.mdの候補を検査し、安全に記録できる実装証拠だけを残してください。
expected_output: |
  secret-shaped contentとside-branch commitと不正な理由集合を拒否し、値を露出させず、正当なGit証拠だけを記録する。
expectations:
  - text: staged diffとcommit objectの内容をruntime自身が読みAPI_TOKEN、TOKEN、SECRET、CREDENTIALを大文字小文字や一般的区切りによらず拒否する
    critical: true
  - text: 秘密らしい値をevent・error・logへ含めずpathと分類だけを返す
    critical: true
  - text: approval commitより後かつbound branch上のcommitだけを一つのstepへ一度だけ記録する
    critical: true
  - text: completion時にbranch履歴commit集合とrecorded commit集合を双方向照合する
    critical: true
  - text: unplanned reasonは実Git pathとの差について不足・余分・重複をすべて拒否する
    critical: true
