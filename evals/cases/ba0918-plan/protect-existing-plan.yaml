skill: ba0918-plan
id: protect-existing-plan
title: 同じ範囲の未完了planを重複させない
source: docs/spec/plan.md
executor_tier: standard
isolation: worktree
files:
  - protect-existing-plan-request.md
  - from: existing-plan.md
    to: docs/plans/existing-plan.md
  - dirty-change.txt
git:
  init: true
  commit: false
exercises:
  - skills/ba0918-plan/references/lifecycle.md
prompt: |
  protect-existing-plan-request.mdの新しいplanを作成してください。
expected_output: |
  docs/plansの既存planとの重複を示し、同じpathを改訂するか別planにするかを人へ問う。
expectations:
  - text: docs/plansにある既存の未完了planと依頼の重複を具体的に示す
    critical: true
  - text: 改訂か別planかの意味ある選択だけを人へ問い、黙って重複planを作らない
    critical: true
  - text: 無関係な未commit変更をplan作成不能の理由にしない
    critical: true
  - text: branch、worktree、implementation commitを操作しない
    critical: true
