skill: ba0918-plan
id: create-human-readable-plan
title: 完全な仕様から正本planを作り独立reviewへ渡す
source: docs/spec/plan.md
executor_tier: standard
isolation: worktree
files:
  - small-approved-change.md
git:
  init: true
  commit: true
  message: fixture baseline
exercises:
  - skills/ba0918-plan/SKILL.md
  - skills/ba0918-plan/references/creation.md
  - skills/ba0918-plan/references/readability.md
prompt: |
  small-approved-change.mdの承認済み仕様から日本語の実装planを作成してください。
expected_output: |
  docs/plans直下へ正本候補を書き、機械可読部分を検査し、別文脈の全体review後にstage済み差分を承認対象として提示する。
expectations:
  - text: Verification coverageをpath・heading・Step番号・completionの厳密な行で書き、Scopeは予定file treeとして書く
    critical: true
  - text: manual Plan ID、revision、content identity、draft、publish処理を作らない
    critical: true
  - text: 各Stepが仕様見出し、順序、予定file、completion、委任、停止条件へ追跡できる
    critical: true
  - text: 反例で失敗する直接証拠を設計し、lintやtype checkなどの補助検査だけで仕様適合を主張しない
    critical: true
  - text: check StepだけがChecksに正確なcommandを宣言し、旧Target specifications・Steps wrapper・本文Completionを生成しない
    critical: true
  - text: skill文言のlive LLM E2Eはscenario・model・token budgetが明示された場合だけ計画する
    critical: true
  - text: 仕様にない入力境界や新規dependencyをplanで決めない
    critical: true
  - text: 別文脈reviewerが最初に全体reviewし、問題が無い状態へ収束させる
    critical: true
  - text: stage済みのcanonical planだけを人へ提示し、明示承認後のcommitを承認記録にする
    critical: true
  - text: implementationやcycleを自動開始しない
    critical: true
