skill: ba0918-plan
id: create-human-readable-plan
title: 完全な仕様から正本と同一bytesの日本語plan草稿を一時fileとして提示する
source: plan:20260822022624
executor_tier: standard
isolation: worktree
files:
  - small-approved-change.md
git:
  init: true
  commit: true
  message: fixture baseline
exercises:
  - skills/ba0918-plan/SKILL.md
  - skills/ba0918-plan/references/creation.md
  - skills/ba0918-plan/references/readability.md
prompt: |
  small-approved-change.mdにある承認済み仕様集合から実装planを作成してください。
expected_output: |
  正本へ保存する全内容を日本語の草稿として.agents/tmp/plans/配下の一時fileへ保存し、chatにはpath、content identity、保存先、判断事項だけを出して人間の確認を求める。確認前は正本と索引を変更しない。
expectations:
  - text: 正本へ保存するplan全体を日本語で、.agents/tmp/plans/配下の一時fileとして正本と同一bytesで保存する
    critical: true
    assert:
      - type: report_regex
        pattern: '\.agents/tmp/plans/[0-9]{14}_[a-z0-9-]+_r[0-9]+_draft\.md'
  - text: chat応答に草稿の全文を複製せず、path、content identity、正本の保存先、判断事項だけを提示する
    critical: true
  - text: 提示したcontent identityが一時fileの現在のbytesのidentityと一致する
    critical: true
  - text: 各手順が仕様条項、変更範囲、必要証拠、停止条件へ追跡できる
    critical: true
  - text: plan ID、revision、適用spec path・revision・条項が正本草稿本文に含まれる
    critical: true
  - text: 前後空白を含む表示名など仕様にない入力classや許容境界を追加せず、観測結果を変える判断を実装へ委譲しない
    critical: true
  - text: 変更しないもの、外部影響、主要riskをplan単体で判断できる
    critical: true
  - text: 人間確認前にplan、索引、status、session historyを作成または変更しない
    critical: true
    assert:
      - type: file_exists
        path: .agents/artifacts/plans/open-plans.json
        expect: false
  - text: 草稿のpath、identity、保存先を示して人間の確認を求め、fileの直接編集を求めない
    critical: true
