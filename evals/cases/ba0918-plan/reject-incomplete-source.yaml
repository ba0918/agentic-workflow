skill: ba0918-plan
id: reject-incomplete-source
title: 重要な設計と検証が不足した入力をplan化しない
source: docs/spec/plan.md
executor_tier: standard
isolation: worktree
files:
  - incomplete-change.md
git:
  init: true
  commit: true
  message: fixture baseline
exercises:
  - skills/ba0918-plan/SKILL.md
  - skills/ba0918-plan/references/creation.md
prompt: |
  incomplete-change.mdから実装planを作成してください。
expected_output: |
  測定値、許容差、反例、検証、人判断が不足しているため正本候補を書かずbrainstormへ戻す。
expectations:
  - text: 不足した判断と実装への影響を具体的に示す
    critical: true
  - text: 不足した意味を推測やdefaultで補わない
    critical: true
  - text: canonical planもdraftも作成しない
    critical: true
  - text: 不足した意味をbrainstormへ戻す
    critical: true
  - text: 仕様見出しから反例感度のある検証portfolioへ対応づけられないことをplan不能の根拠にする
    critical: true
