skill: ba0918-cycle
id: stop-after-convergence-stalls
title: 診断と方法変更後も進捗が無ければ人へ返す
source: docs/spec/cycle.md
executor_tier: standard
isolation: worktree
files:
  - from: convergence-stall.md
    to: situation.md
prompt: |
  situation.mdの2つの停滞について、cycleの次の動きを判断してください。
expected_output: |
  実装は証拠無増加、reviewは未解決件数の横ばい後に悪化しており、どちらも診断と方法変更を1回済ませたため、追加ループせず根拠を添えて人へ返す。
expectations:
  - text: 実装証拠が増えない最初の帰還では即停止せず、原因診断と安全な方法変更を1回行う
    critical: true
  - text: 方法変更後も実装証拠が増えないため、診断結果と証拠境界を人へ返す
    critical: true
  - text: review tupleの横ばいを進捗と扱わず、診断後の悪化も進捗と扱わない
    critical: true
  - text: 診断後の修正でもtupleが減らないため、未解決指摘と比較値を人へ返す
    critical: true
  - text: 固定回数の上限を停止理由にしない
    critical: true
