skill: ba0918-brainstorm
id: recovery-and-conflict
title: compact後の意味復元と同時更新競合
source: docs/spec/brainstorm.md
executor_tier: standard
isolation: worktree
files:
  - recovery-and-conflict.md
  - candidate.json
  - from: current-progress.md
    to: .agents/tmp/ideas/20260821T220000Z-demo.md
git:
  init: true
  commit: true
  message: fixture baseline
exercises:
  - skills/ba0918-brainstorm/references/state.md
  - skills/ba0918-brainstorm/scripts/state.py
prompt: |
  保存済みprogressを復元し、candidate.jsonを古いexpected revisionで保存しようとして競合を処理してください。
expected_output: |
  現在側を維持し候補を時刻付きconflict fileへ退避して、自動mergeせず人へ返す。
expectations:
  - text: progressを.agents/tmp/ideasのsession固有fileから復元する
    critical: true
  - text: integer revisionの競合を検出して現在側と候補側の両方を残す
    critical: true
  - text: 文書identityを要求せず、自動mergeまたは上書きをしない
    critical: true
