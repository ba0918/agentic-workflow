skill: ba0918-brainstorm
id: target-minor-review-fixes
title: 軽微なreview指摘を自走修正して限定再reviewする
source: docs/spec/brainstorm.md
executor_tier: standard
isolation: worktree
files:
  - from: minor-review-correction.md
    to: situation.md
prompt: |
  situation.mdのarchitect findingsを処理してください。
expected_output: |
  人へ止めずtypoとagreement漏れを直し、同じarchitectへ未解決findingと差分だけを渡してclosedを確認する。
expectations:
  - text: 意味を変えないtypoと記録漏れを人へ確認せず修正する
    critical: true
  - text: 未解決findingと修正差分を同じarchitectへtargeted re-reviewする
    critical: true
  - text: findingがclosedになるまで承認へ進まない
    critical: true
  - text: 意味が変わらないためfull architecture reviewを繰り返さない
    critical: true
