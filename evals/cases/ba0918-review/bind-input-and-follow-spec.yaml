skill: ba0918-review
id: bind-input-and-follow-spec
title: 三入力を同じreviewへ束ね仕様変更を意味判定する
source: docs/spec/review.md
executor_tier: standard
isolation: worktree
files:
  - from: input-and-drift.md
    to: situation.md
prompt: |
  situation.mdの入力と仕様変更についてreview開始・継続判断を返してください。
expected_output: |
  branch、2 commit、run idを同じ工程へ束ね、文言変更はGit版へ追従し、persistence変更だけfindings_staleで一時停止する。
expectations:
  - text: branchは明示比較先、pull request target、default branchとのmerge-baseの順でbaseを解決する
    critical: true
  - text: branch、2 commits、implement run idの3入力を受け付ける
    critical: true
  - text: branchとcommitをGitで解決して架空refを拒否し、branch tipから選択targetへのmerge-baseを束ねる
    critical: true
  - text: implement runはbinding・連番event・最後のimplementation_green・branch/worktree・共有revision segmentを検証し、recovering/reboundの正当な文書改訂tipを許可する
    critical: true
  - text: standalone入力では指定specまたはdocs/specを根拠としてGit commitを記録する
    critical: true
  - text: review selectorとbinding IDをpath使用前に検証し、正規evidence store外やsymlink親へ一切書き込まない
    critical: true
  - text: 重要判断を変えないspec変更は新Git版へ追従する
    critical: true
  - text: persistence変更はfindings_staleとして止め、open findingを保持してrebound可能にする
    critical: true
  - text: level、profileと選択元、modelと選択元、明示されたsecond reviewer/modelをbindingへ記録する
    critical: true
  - text: unknown profileを拒否し、eval fixtureをskill profileへ分類し、各stage結果へfirst reviewerのactual model明示入力を必須化してrequested modelで代用しない
    critical: true
  - text: second reviewerとsecond modelは組として検証し、片方だけなら拒否する
    critical: true
  - text: 同じreviewerの安全確認結果が未完了または未解決ならfinding集合を成功記録しない
    critical: true
  - text: finding全nested文字列を形式（空でない・長さ上限・NULを含まない）で検証し、profile・相対spec path・実在spec commitをactive bindingへ束縛して拒否時はeventを増やさない
    critical: true
  - text: second reviewerはskillがplanとdiffだけをsecret scan後に一度渡し、利用不能なら警告して単独reviewを続ける
    critical: true
