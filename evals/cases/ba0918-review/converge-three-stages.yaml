skill: ba0918-review
id: converge-three-stages
title: 初回全体・限定・最終全体reviewを収束させる
source: docs/spec/review.md
executor_tier: standard
isolation: worktree
files:
  - from: three-stage.md
    to: situation.md
prompt: |
  situation.mdのreview工程を進めてください。
expected_output: |
  初回全体review後は未解決と修正差分だけを見て関連回帰を追加し、無関係な軽微事項は終端観察へ分け、全件close後に最終全体reviewを1回だけ行い、新規warnを限定reviewで閉じる。
expectations:
  - text: 初回は対象全体、修正中はopen findingとtrailer付き差分と持込みriskだけを見る
    critical: true
  - text: 修正が生んだsecurity findingと関連warn regressionをadmitする
    critical: true
  - text: 無関係なwarnとminor（info）observationは現在のverdictへ入れず終端観察へ送る
    critical: true
  - text: open件数をsecurity、critical、warnの辞書順で比較する
    critical: true
  - text: 全件close後に別文脈のfinal full reviewを1回だけ行う
    critical: true
  - text: final reviewの新規warnをtargeted reviewで閉じ、full reviewを繰り返さない
    critical: true
  - text: reviewer自身は修正しない
    critical: true
